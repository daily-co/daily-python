[build-system]
requires = ["maturin>=1.2,<2.0"]
build-backend = "maturin"

[project]
name = "daily-python"
description = "Daily Client SDK for Python"
license = { text = "BSD 2-Clause License" }
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["webrtc", "audio", "video", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Home = "https://docs.daily.co/guides/products/ai-toolkit"
Documentation = "https://reference-python.daily.co"
Source = "https://github.com/daily-co/daily-python"
Website = "https://daily.co"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
# Don't build/install daily-python itself on `uv sync`; the wheel is built
# explicitly with maturin. `uv sync` just provides the build/docs tooling.
package = false

[dependency-groups]
dev = [
    "maturin>=1.16.0,<2",
    "ruff>=0.12.11,<1",
    "setuptools>=84.2.1,<85",
    "sphinx>=7.4.7,<8",
    "sphinx-rtd-theme>=2.0.0,<3",
    "toml>=0.10.2,<1",
    "patchelf>=0.17.2.2,<1; sys_platform == 'linux'",
    "pyright>=1.1.411,<2",
]
demos = [
    "celery>=5.5.3,<6",
    "deepgram-sdk>=5.3.0,<6",
    "flask>=3.1.2,<4",
    "google-cloud-speech>=2.34.0,<3",
    "google-cloud-texttospeech>=2.33.0,<3",
    "numpy>=2.3.5,<3",
    "openai>=2.8.0,<3",
    "pillow>=13.0.0,<14",
    "pyaudio>=0.2.14,<1",
    "pycairo>=1.29.0,<2",
    # GTK: no Windows wheels, and building it needs GTK installed.
    "pygobject>=3.54.5,<4; sys_platform != 'win32'",
    "pyside6>=6.10.0,<7",
    "redis>=7.0.1,<8",
    "ultralytics>=8.4.184,<9",
    # Needed by ultralytics for tracking; it would otherwise try to pip-install
    # it at runtime, which fails in a uv venv.
    "lap>=0.5.13,<1",
    "aiohttp>=3.14.5,<4",
    "pydantic>=2.12.4,<3",
    "python-dotenv>=1.2.1,<2",
]

[tool.uv.dependency-groups]
# The published package supports older Pythons (`requires-python` above), but
# the build/docs tooling and the demos need newer ones.
dev = { requires-python = ">=3.10" }
demos = { requires-python = ">=3.11" }
